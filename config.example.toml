# Copia questo file in config.toml (ignorato da git) e adatta i valori.

[panel]
# Risoluzione nativa del Kindle 4/Touch (K4 platform): 600x800.
width = 600
height = 720
# Ogni quanto la pagina si ricarica nel browser. Il PNG viene ridisegnato a ogni richiesta,
# quindi l'orologio resta preciso anche se i dati (meteo/treni/calendario) hanno un TTL più lungo.
refresh_seconds = 90

[location]
name = "Genova"
latitude = 44.4072
longitude = 8.9476

[weather]
days = 3
timezone = "Europe/Rome"

[sea]
# Condizioni del mare dalle stesse coordinate di [location] (Open-Meteo Marine API, nessuna chiave):
# stato in scala Douglas, altezza d'onda e direzione di provenienza. false = pannello senza mare.
enabled = false
# Giorni di previsione: si accoppiano **per data** alle giornate del meteo, non per posizione.
days = 3

[calendar]
# Google Calendar > Impostazioni calendario > "Indirizzo segreto in formato iCal".
# Vuoto = riquadro calendario non configurato. Si può fornire anche via KDASH_ICS_URL.
ics_url = ""
max_events = 4
days_ahead = 7

[waste]
# Calendario della raccolta differenziata: un iCal **pubblico** con un evento all-day per ogni
# giorno di raccolta e il materiale nel titolo (es. "Umido"). Se il calendario non è tuo, in
# Google Calendar > Impostazioni > "Indirizzo pubblico in formato iCal" trovi l'URL `.../public/basic.ics`.
# Vuoto = la colonna destra non viene disegnata e il calendario eventi resta a tutta larghezza.
ics_url = ""
# Giorni mostrati: oggi, domani e i successivi. I giorni senza raccolta compaiono come "niente".
days = 3

[trains]
base_url = "https://api.transitous.org"
# Partenze mostrate: la stazione di partenza (una sola per pannello).
station = "Genova Brignole"
# Ottieni lo stop_id con:
#   python -m kindle_dashboard resolve-station "Genova Brignole"
stop_id = "it-trenitalia_04702"
max_departures = 3
# Vuoto = tutte le destinazioni. Altrimenti filtra per sottostringa (case-insensitive).
destinations = []
# Seconda riga per treno con le fermate intermedie che corrispondono a `destinations`, con orario.
# Costa una richiesta HTTP per treno mostrato.
stop_details = false
# Fermate da non sacrificare quando la riga non basta (il resto viene ridotto).
stop_priority = []

[render]
# Percorsi TTF opzionali. Vuoto = Liberation Sans, **lo stesso font che il `Dockerfile` installa nel
# container**: l'anteprima sul PC deve misurare gli stessi pixel del Kindle, altrimenti mostra righe
# integre che sul device finiscono in «…». Ripieghi in ordine: Segoe UI Semibold, Verdana, Arial,
# Tahoma, DejaVu Sans, Noto Sans.
font = ""
font_bold = ""

[server]
host = "0.0.0.0"
port = 8787

[schedule]
# Fascia notturna: ricarica più rada e scritta NOTTE al posto dell'orario.
# L'intervallo non supera mai il confine successivo: alle 06:29 si ricarica subito, non fra un'ora.
night_start = "23:00"
night_end = "06:30"
night_refresh_seconds = 3600

[cache]
dir = "cache"
