services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: kindle-dashboard:local
    container_name: kindle-dashboard
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./config.toml:/home/appuser/config.toml:ro
      - ./cache:/home/appuser/cache
      # Opzionale: hot-reload sorgenti in dev (sovrascrive COPY dell'immagine)
      - ./kindle_dashboard:/home/appuser/kindle_dashboard:ro
    environment:
      - TZ=Europe/Rome
      - KDASH_ICS_URL=${KDASH_ICS_URL:-}
    healthcheck:
      # python:3.12-slim non include wget/curl: il controllo usa la stdlib.
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/health').status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Limiti risorse (best practice per Pi / VM piccole)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M